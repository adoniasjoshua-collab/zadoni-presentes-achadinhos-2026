name: Validate static site
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test SEO regression detector
        run: python -m unittest discover -s scripts -p test_seo_baseline.py
      - name: Validate site and protected baseline
        shell: bash
        run: |
          set -e
          for validator in scripts/validate-*.mjs; do
            node "$validator"
          done
